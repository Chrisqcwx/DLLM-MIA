global:
  load_from_base_dir: true
  target_model: "./"
  tokenizer: "./"
  datasets:
    - json_train_path: "./train_subset_cut0.3.json"
      json_test_path: "./test_subset_cut0.3.json"
      cache_name: "dataset_cut0.3"
  batch_size: 1
  seed: 42
  device: "cuda"  # This will use all available GPUs
  fpr_thresholds:
    - 0.1
    - 0.01
    - 0.001
  n_bootstrap_samples: 10
  test_samples: null  # Adjust this number as needed
  max_length: 512
  cache_dir: null



Mtc5depend-4-0.1-layer-0-1-least1:
  module: "mtc5depend"
  lambda_penalty: 0.1
  leastm: 1
  weight_start_layer_ratio: 0
  weight_end_layer_ratio: 1
  steps: 4
  subset_size: 8          # l for each local subset vote
  num_subsets: 128        # number of subsets per step
  l_schedule: "linear"    # or "geometric"
  min_mask_frac: 0.05     # ~5% of valid tokens masked at early steps
  max_mask_frac: 0.50     # up to ~50% by the last step
  batch_size: 8
  max_length: 512
  reference_model_path: "GSAI-ML/LLaDA-8B-Base"
  reference_device: "cuda"
  seed: 42
  save_metadata: false
  metadata_dir: ""  # Set via SAMA_METADATA_DIR env variable, or specify a path here

