global:
  load_from_base_dir: true
  target_model: "./"
  tokenizer: "./"
  datasets:
    - json_train_path: "./train_subset.json"
      json_test_path: "./test_subset.json"
  batch_size: 2
  seed: 42
  device: "cuda:0"
  fpr_thresholds:
    - 0.1
    - 0.01
    - 0.001
  n_bootstrap_samples: 10
  test_samples: null
  max_length: 512
  cache_dir: null

Dfmia-r50-cal256:
  module: "dfmia"
  reference_model_path: "GSAI-ML/LLaDA-8B-Base"
  reference_device: "cuda"
  stage1_score_column: "nlloss"
  pseudo_nonmember_ratio: 0.5
  min_pseudo_nonmembers: 64
  max_pseudo_nonmembers: 512
  calibration_samples: 256
  num_perturbations: 1
  perturbation_ratio: 0.15
  score_stat: "median_mad"
  dllm_mc_num: 8
  dllm_mask_ratio: 0.5
  batch_size: 2
  max_length: 512
  seed: 42
  save_metadata: true
  metadata_dir: "./attack_results/debug_dfmia"
